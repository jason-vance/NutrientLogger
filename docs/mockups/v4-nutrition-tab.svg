<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844">
  <defs>
    <linearGradient id="cardGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1E1E1E"/>
      <stop offset="100%" stop-color="#252525"/>
    </linearGradient>
    <linearGradient id="streakGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FF6B35"/>
      <stop offset="100%" stop-color="#FF9F1C"/>
    </linearGradient>
    <clipPath id="screenClip">
      <rect x="0" y="0" width="390" height="844" rx="44"/>
    </clipPath>
  </defs>

  <!-- Phone frame -->
  <rect width="390" height="844" rx="44" fill="#000000"/>
  <rect x="1" y="1" width="388" height="842" rx="43" fill="#121212" clip-path="url(#screenClip)"/>

  <!-- Status bar -->
  <text x="36" y="22" font-family="-apple-system, SF Pro, Helvetica" font-size="15" font-weight="600" fill="#FFFFFF">9:41</text>
  <rect x="330" y="12" width="22" height="10" rx="3" fill="none" stroke="#FFFFFF" stroke-width="1.2"/>
  <rect x="332" y="14" width="15" height="6" rx="1.5" fill="#FFFFFF"/>

  <!-- Navigation bar -->
  <text x="20" y="58" font-family="-apple-system, SF Pro, Helvetica" font-size="28" font-weight="700" fill="#FFFFFF">Good Afternoon</text>
  <!-- Toolbar: gear icon -->
  <g transform="translate(326, 42)">
    <circle cx="8" cy="8" r="7" fill="none" stroke="#4A90D9" stroke-width="1.5"/>
    <circle cx="8" cy="8" r="3" fill="none" stroke="#4A90D9" stroke-width="1.5"/>
  </g>
  <!-- Toolbar: camera icon -->
  <g transform="translate(351, 42)">
    <rect x="1" y="5" width="16" height="11" rx="2" fill="none" stroke="#4A90D9" stroke-width="1.5"/>
    <circle cx="9" cy="11" r="3.5" fill="none" stroke="#4A90D9" stroke-width="1.3"/>
    <rect x="5" y="3" width="8" height="3" rx="1" fill="none" stroke="#4A90D9" stroke-width="1.2"/>
  </g>

  <!-- Search bar -->
  <g transform="translate(20, 72)">
    <rect width="350" height="40" rx="12" fill="#2A2A2A"/>
    <circle cx="26" cy="20" r="6" fill="none" stroke="#666666" stroke-width="1.5"/>
    <line x1="30" y1="24" x2="34" y2="28" stroke="#666666" stroke-width="1.5" stroke-linecap="round"/>
    <text x="42" y="26" font-family="-apple-system, SF Pro, Helvetica" font-size="16" fill="#666666">Search foods or scan...</text>
  </g>

  <!-- Streak card -->
  <g transform="translate(20, 124)">
    <rect width="350" height="56" rx="14" fill="url(#streakGrad)" opacity="0.12"/>
    <rect width="350" height="56" rx="14" fill="none" stroke="url(#streakGrad)" stroke-width="0.8" opacity="0.3"/>
    <!-- Flame icon -->
    <g transform="translate(14, 14)">
      <path d="M8,20 C8,12 13,9 13,4 C16,9 21,12 21,20 C21,24 17,26 14,26 C11,26 8,24 8,20 Z" fill="#FF9500"/>
      <path d="M11,20 C11,16 14,14 14,10 C15,14 18,16 18,20 C18,23 16,24 14,24 C12,24 11,23 11,20 Z" fill="#FFD60A"/>
    </g>
    <text x="46" y="36" font-family="-apple-system, SF Pro, Helvetica" font-size="18" font-weight="700" fill="#FF9F1C">12-Day Streak!</text>
    <!-- Mini progress bar toward next milestone -->
    <rect x="200" y="28" width="100" height="5" rx="2.5" fill="#333333"/>
    <rect x="200" y="28" width="86" height="5" rx="2.5" fill="url(#streakGrad)"/>
    <text x="310" y="34" font-family="-apple-system, SF Pro, Helvetica" font-size="10" fill="#888888">14</text>
  </g>

  <!-- Date nav -->
  <g transform="translate(20, 194)">
    <text x="100" y="18" font-family="-apple-system, SF Pro, Helvetica" font-size="15" font-weight="600" fill="#4A90D9" text-anchor="middle">&lt;</text>
    <text x="175" y="18" font-family="-apple-system, SF Pro, Helvetica" font-size="15" font-weight="600" fill="#4A90D9" text-anchor="middle">Wed, Jun 25</text>
    <text x="250" y="18" font-family="-apple-system, SF Pro, Helvetica" font-size="15" font-weight="600" fill="#4A90D9" text-anchor="middle">&gt;</text>
  </g>

  <!-- Macros ring + summary (current style, kept) -->
  <g transform="translate(20, 222)">
    <rect width="350" height="130" rx="14" fill="url(#cardGrad)"/>

    <!-- Large calorie ring -->
    <circle cx="70" cy="65" r="42" fill="none" stroke="#2A2A2A" stroke-width="8"/>
    <circle cx="70" cy="65" r="42" fill="none" stroke="#4A90D9" stroke-width="8"
            stroke-dasharray="216 264" stroke-linecap="round" transform="rotate(-90 70 65)"/>
    <text x="70" y="60" font-family="-apple-system, SF Pro, Helvetica" font-size="22" font-weight="700" fill="#FFFFFF" text-anchor="middle">1,840</text>
    <text x="70" y="78" font-family="-apple-system, SF Pro, Helvetica" font-size="11" fill="#888888" text-anchor="middle">/ 2,250 kcal</text>

    <!-- Macro bars to the right -->
    <g transform="translate(140, 18)">
      <text x="0" y="12" font-family="-apple-system, SF Pro, Helvetica" font-size="13" fill="#CCCCCC">Protein</text>
      <rect x="65" y="4" width="120" height="6" rx="3" fill="#333333"/>
      <rect x="65" y="4" width="113" height="6" rx="3" fill="#34C759"/>
      <text x="192" y="12" font-family="-apple-system, SF Pro, Helvetica" font-size="11" fill="#34C759" text-anchor="end">142g</text>
    </g>
    <g transform="translate(140, 44)">
      <text x="0" y="12" font-family="-apple-system, SF Pro, Helvetica" font-size="13" fill="#CCCCCC">Fat</text>
      <rect x="65" y="4" width="120" height="6" rx="3" fill="#333333"/>
      <rect x="65" y="4" width="66" height="6" rx="3" fill="#FF9500"/>
      <text x="192" y="12" font-family="-apple-system, SF Pro, Helvetica" font-size="11" fill="#FF9500" text-anchor="end">62g</text>
    </g>
    <g transform="translate(140, 70)">
      <text x="0" y="12" font-family="-apple-system, SF Pro, Helvetica" font-size="13" fill="#CCCCCC">Carbs</text>
      <rect x="65" y="4" width="120" height="6" rx="3" fill="#333333"/>
      <rect x="65" y="4" width="106" height="6" rx="3" fill="#FFD60A"/>
      <text x="192" y="12" font-family="-apple-system, SF Pro, Helvetica" font-size="11" fill="#FFD60A" text-anchor="end">210g</text>
    </g>
    <g transform="translate(140, 96)">
      <text x="0" y="12" font-family="-apple-system, SF Pro, Helvetica" font-size="13" fill="#CCCCCC">Water</text>
      <rect x="65" y="4" width="120" height="6" rx="3" fill="#333333"/>
      <rect x="65" y="4" width="90" height="6" rx="3" fill="#5AC8FA"/>
      <text x="192" y="12" font-family="-apple-system, SF Pro, Helvetica" font-size="11" fill="#5AC8FA" text-anchor="end">6 / 8</text>
    </g>
  </g>

  <!-- Vitamins section -->
  <text x="20" y="376" font-family="-apple-system, SF Pro, Helvetica" font-size="13" font-weight="600" fill="#888888" letter-spacing="0.5">VITAMINS</text>

  <g transform="translate(20, 388)">
    <rect width="350" height="110" rx="14" fill="url(#cardGrad)"/>
    <text x="18" y="24" font-family="-apple-system, SF Pro, Helvetica" font-size="14" fill="#CCCCCC">Vitamin A</text>
    <rect x="110" y="16" width="160" height="6" rx="3" fill="#333333"/>
    <rect x="110" y="16" width="125" height="6" rx="3" fill="#A78BFA"/>
    <text x="332" y="24" font-family="-apple-system, SF Pro, Helvetica" font-size="12" fill="#A78BFA" text-anchor="end">78%</text>
    <text x="18" y="50" font-family="-apple-system, SF Pro, Helvetica" font-size="14" fill="#CCCCCC">Vitamin C</text>
    <rect x="110" y="42" width="160" height="6" rx="3" fill="#333333"/>
    <rect x="110" y="42" width="160" height="6" rx="3" fill="#34C759"/>
    <text x="332" y="50" font-family="-apple-system, SF Pro, Helvetica" font-size="12" fill="#34C759" text-anchor="end">102%</text>
    <text x="18" y="76" font-family="-apple-system, SF Pro, Helvetica" font-size="14" fill="#CCCCCC">Vitamin D</text>
    <rect x="110" y="68" width="160" height="6" rx="3" fill="#333333"/>
    <rect x="110" y="68" width="51" height="6" rx="3" fill="#FF3B30"/>
    <text x="332" y="76" font-family="-apple-system, SF Pro, Helvetica" font-size="12" fill="#FF3B30" text-anchor="end">32%</text>
    <text x="332" y="100" font-family="-apple-system, SF Pro, Helvetica" font-size="13" fill="#4A90D9" text-anchor="end">More &gt;</text>
  </g>

  <!-- Minerals section -->
  <text x="20" y="522" font-family="-apple-system, SF Pro, Helvetica" font-size="13" font-weight="600" fill="#888888" letter-spacing="0.5">MINERALS</text>

  <g transform="translate(20, 534)">
    <rect width="350" height="84" rx="14" fill="url(#cardGrad)"/>
    <text x="18" y="24" font-family="-apple-system, SF Pro, Helvetica" font-size="14" fill="#CCCCCC">Iron</text>
    <rect x="110" y="16" width="160" height="6" rx="3" fill="#333333"/>
    <rect x="110" y="16" width="146" height="6" rx="3" fill="#34C759"/>
    <text x="332" y="24" font-family="-apple-system, SF Pro, Helvetica" font-size="12" fill="#34C759" text-anchor="end">91%</text>
    <text x="18" y="50" font-family="-apple-system, SF Pro, Helvetica" font-size="14" fill="#CCCCCC">Magnesium</text>
    <rect x="110" y="42" width="160" height="6" rx="3" fill="#333333"/>
    <rect x="110" y="42" width="70" height="6" rx="3" fill="#FF9500"/>
    <text x="332" y="50" font-family="-apple-system, SF Pro, Helvetica" font-size="12" fill="#FF9500" text-anchor="end">44%</text>
    <text x="332" y="74" font-family="-apple-system, SF Pro, Helvetica" font-size="13" fill="#4A90D9" text-anchor="end">More &gt;</text>
  </g>

  <!-- Meals section -->
  <text x="20" y="642" font-family="-apple-system, SF Pro, Helvetica" font-size="13" font-weight="600" fill="#888888" letter-spacing="0.5">MEALS</text>

  <g transform="translate(20, 652)">
    <rect width="350" height="94" rx="14" fill="url(#cardGrad)"/>
    <text x="18" y="22" font-family="-apple-system, SF Pro, Helvetica" font-size="14" font-weight="600" fill="#DDDDDD">Breakfast</text>
    <text x="332" y="22" font-family="-apple-system, SF Pro, Helvetica" font-size="13" fill="#888888" text-anchor="end">229 kcal</text>
    <text x="18" y="40" font-family="-apple-system, SF Pro, Helvetica" font-size="13" fill="#888888">Greek Yogurt, Banana</text>
    <line x1="18" y1="50" x2="332" y2="50" stroke="#333333" stroke-width="0.5"/>
    <text x="18" y="68" font-family="-apple-system, SF Pro, Helvetica" font-size="14" font-weight="600" fill="#DDDDDD">Lunch</text>
    <text x="332" y="68" font-family="-apple-system, SF Pro, Helvetica" font-size="13" fill="#888888" text-anchor="end">500 kcal</text>
    <text x="18" y="86" font-family="-apple-system, SF Pro, Helvetica" font-size="13" fill="#888888">Chicken Breast, Brown Rice</text>
  </g>

  <!-- Weekly Insights (collapsed/teaser) -->
  <g transform="translate(20, 758)">
    <rect width="350" height="20" rx="10" fill="url(#cardGrad)" opacity="0.6"/>
    <circle cx="16" cy="10" r="4" fill="#FF9500" opacity="0.8"/>
    <text x="28" y="14" font-family="-apple-system, SF Pro, Helvetica" font-size="12" fill="#AAAAAA">Low this week: Vitamin D, Magnesium</text>
    <text x="332" y="14" font-family="-apple-system, SF Pro, Helvetica" font-size="12" fill="#4A90D9" text-anchor="end">Details &gt;</text>
  </g>

  <!-- Tab bar -->
  <g transform="translate(0, 780)">
    <rect width="390" height="64" fill="#1A1A1A"/>
    <line x1="0" y1="0" x2="390" y2="0" stroke="#333333" stroke-width="0.5"/>

    <!-- Nutrition tab (active) - leaf icon -->
    <g transform="translate(52, 12)">
      <rect x="-2" y="4" width="60" height="24" rx="12" fill="#4A90D9" opacity="0.15"/>
      <path d="M20,20 Q20,6 34,6 Q34,20 20,20 Z" fill="none" stroke="#4A90D9" stroke-width="1.5"/>
      <path d="M20,20 Q27,16 30,10" fill="none" stroke="#4A90D9" stroke-width="1.2" stroke-linecap="round"/>
      <text x="27" y="38" font-family="-apple-system, SF Pro, Helvetica" font-size="10" font-weight="600" fill="#4A90D9" text-anchor="middle">Nutrition</text>
    </g>

    <!-- Body tab - figure icon -->
    <g transform="translate(168, 12)">
      <circle cx="27" cy="6" r="3" fill="none" stroke="#888888" stroke-width="1.5"/>
      <line x1="27" y1="9" x2="27" y2="19" stroke="#888888" stroke-width="1.5"/>
      <line x1="21" y1="13" x2="33" y2="13" stroke="#888888" stroke-width="1.5" stroke-linecap="round"/>
      <line x1="27" y1="19" x2="22" y2="26" stroke="#888888" stroke-width="1.5" stroke-linecap="round"/>
      <line x1="27" y1="19" x2="32" y2="26" stroke="#888888" stroke-width="1.5" stroke-linecap="round"/>
      <text x="27" y="38" font-family="-apple-system, SF Pro, Helvetica" font-size="10" fill="#888888" text-anchor="middle">Body</text>
    </g>

    <!-- Profile tab - person icon -->
    <g transform="translate(283, 12)">
      <circle cx="27" cy="8" r="4.5" fill="none" stroke="#888888" stroke-width="1.5"/>
      <path d="M17,24 Q17,16 27,16 Q37,16 37,24" fill="none" stroke="#888888" stroke-width="1.5" stroke-linecap="round"/>
      <text x="27" y="38" font-family="-apple-system, SF Pro, Helvetica" font-size="10" fill="#888888" text-anchor="middle">Profile</text>
    </g>
  </g>

  <rect x="142" y="826" width="106" height="5" rx="2.5" fill="#555555"/>
</svg>