<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844">
  <defs>
    <linearGradient id="cardGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1E1E1E"/>
      <stop offset="100%" stop-color="#252525"/>
    </linearGradient>
    <clipPath id="screenClip">
      <rect x="0" y="0" width="390" height="844" rx="44"/>
    </clipPath>
  </defs>

  <!-- Phone frame -->
  <rect width="390" height="844" rx="44" fill="#000000"/>
  <rect x="1" y="1" width="388" height="842" rx="43" fill="#121212" clip-path="url(#screenClip)"/>

  <!-- Status bar -->
  <text x="36" y="22" font-family="-apple-system, SF Pro, Helvetica" font-size="15" font-weight="600" fill="#FFFFFF">9:41</text>
  <rect x="330" y="12" width="22" height="10" rx="3" fill="none" stroke="#FFFFFF" stroke-width="1.2"/>
  <rect x="332" y="14" width="15" height="6" rx="1.5" fill="#FFFFFF"/>

  <!-- Navigation bar -->
  <text x="20" y="62" font-family="-apple-system, SF Pro, Helvetica" font-size="34" font-weight="700" fill="#FFFFFF">Profile</text>

  <!-- Profile card -->
  <g transform="translate(20, 82)">
    <rect width="350" height="100" rx="16" fill="url(#cardGrad)"/>
    <!-- Avatar circle with person icon drawn as shapes -->
    <circle cx="56" cy="50" r="32" fill="#2A2A2A"/>
    <circle cx="56" cy="40" r="10" fill="#555555"/>
    <ellipse cx="56" cy="68" rx="16" ry="10" fill="#555555"/>
    <!-- Name and details -->
    <text x="105" y="36" font-family="-apple-system, SF Pro, Helvetica" font-size="20" font-weight="700" fill="#FFFFFF">Jason V.</text>
    <text x="105" y="56" font-family="-apple-system, SF Pro, Helvetica" font-size="14" fill="#888888">32 &#x00B7; Male &#x00B7; 5'11"</text>
    <text x="105" y="78" font-family="-apple-system, SF Pro, Helvetica" font-size="13" fill="#4A90D9">Edit Profile &gt;</text>
  </g>

  <!-- Subscription card -->
  <g transform="translate(20, 196)">
    <rect width="350" height="72" rx="14" fill="url(#cardGrad)"/>
    <rect width="350" height="72" rx="14" fill="none" stroke="#4A90D9" stroke-width="0.5" opacity="0.3"/>
    <text x="18" y="26" font-family="-apple-system, SF Pro, Helvetica" font-size="15" font-weight="600" fill="#FFFFFF">Premium (Yearly)</text>
    <!-- Checkmark badge -->
    <rect x="175" y="12" width="14" height="14" rx="7" fill="#34C759"/>
    <polyline points="179,19 182,22 187,16" fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="18" y="46" font-family="-apple-system, SF Pro, Helvetica" font-size="13" fill="#888888">Renews: Jul 12, 2027</text>
    <text x="332" y="46" font-family="-apple-system, SF Pro, Helvetica" font-size="13" fill="#4A90D9" text-anchor="end">Manage &gt;</text>
  </g>

  <!-- Achievements section -->
  <text x="20" y="296" font-family="-apple-system, SF Pro, Helvetica" font-size="13" font-weight="600" fill="#888888" letter-spacing="0.5">ACHIEVEMENTS</text>

  <g transform="translate(20, 308)">
    <rect width="350" height="118" rx="14" fill="url(#cardGrad)"/>

    <!-- Longest Streak -->
    <g transform="translate(18, 14)">
      <!-- Flame icon as shapes -->
      <path d="M6,14 C6,8 10,6 10,2 C12,6 16,8 16,14 C16,17 13,19 11,19 C9,19 6,17 6,14 Z" fill="#FF9500" opacity="0.9"/>
      <path d="M9,14 C9,11 11,10 11,7 C12,10 14,11 14,14 C14,16 12.5,17 11,17 C9.5,17 9,16 9,14 Z" fill="#FFD60A" opacity="0.8"/>
      <text x="26" y="14" font-family="-apple-system, SF Pro, Helvetica" font-size="14" fill="#CCCCCC">Longest Streak</text>
      <text x="314" y="14" font-family="-apple-system, SF Pro, Helvetica" font-size="14" font-weight="600" fill="#FFFFFF" text-anchor="end">14 days</text>
    </g>

    <!-- Days Logged -->
    <g transform="translate(18, 42)">
      <!-- Calendar icon -->
      <rect x="3" y="3" width="14" height="13" rx="2" fill="none" stroke="#5AC8FA" stroke-width="1.5"/>
      <line x1="3" y1="7" x2="17" y2="7" stroke="#5AC8FA" stroke-width="1.5"/>
      <line x1="7" y1="1" x2="7" y2="5" stroke="#5AC8FA" stroke-width="1.5" stroke-linecap="round"/>
      <line x1="13" y1="1" x2="13" y2="5" stroke="#5AC8FA" stroke-width="1.5" stroke-linecap="round"/>
      <text x="26" y="14" font-family="-apple-system, SF Pro, Helvetica" font-size="14" fill="#CCCCCC">Days Logged</text>
      <text x="314" y="14" font-family="-apple-system, SF Pro, Helvetica" font-size="14" font-weight="600" fill="#FFFFFF" text-anchor="end">147</text>
    </g>

    <!-- Foods Tracked -->
    <g transform="translate(18, 70)">
      <!-- Apple icon -->
      <ellipse cx="10" cy="11" rx="6" ry="7" fill="none" stroke="#34C759" stroke-width="1.5"/>
      <path d="M10,4 Q12,1 14,2" fill="none" stroke="#34C759" stroke-width="1.2" stroke-linecap="round"/>
      <text x="26" y="14" font-family="-apple-system, SF Pro, Helvetica" font-size="14" fill="#CCCCCC">Foods Tracked</text>
      <text x="314" y="14" font-family="-apple-system, SF Pro, Helvetica" font-size="14" font-weight="600" fill="#FFFFFF" text-anchor="end">1,203</text>
    </g>

    <!-- Body Logs -->
    <g transform="translate(18, 98)">
      <!-- Scale icon -->
      <rect x="2" y="8" width="16" height="10" rx="3" fill="none" stroke="#A78BFA" stroke-width="1.5"/>
      <line x1="6" y1="8" x2="10" y2="4" stroke="#A78BFA" stroke-width="1.5" stroke-linecap="round"/>
      <line x1="14" y1="8" x2="10" y2="4" stroke="#A78BFA" stroke-width="1.5" stroke-linecap="round"/>
      <text x="26" y="14" font-family="-apple-system, SF Pro, Helvetica" font-size="14" fill="#CCCCCC">Body Logs</text>
      <text x="314" y="14" font-family="-apple-system, SF Pro, Helvetica" font-size="14" font-weight="600" fill="#FFFFFF" text-anchor="end">38</text>
    </g>
  </g>

  <!-- Data section -->
  <text x="20" y="454" font-family="-apple-system, SF Pro, Helvetica" font-size="13" font-weight="600" fill="#888888" letter-spacing="0.5">DATA</text>

  <g transform="translate(20, 466)">
    <rect width="350" height="156" rx="14" fill="url(#cardGrad)"/>

    <!-- Apple Health -->
    <g transform="translate(18, 14)">
      <text x="0" y="14" font-family="-apple-system, SF Pro, Helvetica" font-size="14" fill="#CCCCCC">Apple Health</text>
      <!-- Toggle ON -->
      <rect x="270" y="0" width="44" height="24" rx="12" fill="#34C759"/>
      <circle cx="300" cy="12" r="10" fill="#FFFFFF"/>
    </g>
    <line x1="18" y1="38" x2="332" y2="38" stroke="#333333" stroke-width="0.5"/>

    <!-- Export CSV -->
    <g transform="translate(18, 50)">
      <text x="0" y="14" font-family="-apple-system, SF Pro, Helvetica" font-size="14" fill="#CCCCCC">Export CSV</text>
      <rect x="100" y="0" width="68" height="18" rx="6" fill="#4A90D9" opacity="0.15"/>
      <text x="134" y="13" font-family="-apple-system, SF Pro, Helvetica" font-size="10" font-weight="600" fill="#4A90D9" text-anchor="middle">PREMIUM</text>
      <text x="314" y="14" font-family="-apple-system, SF Pro, Helvetica" font-size="16" fill="#555555" text-anchor="end">&gt;</text>
    </g>
    <line x1="18" y1="74" x2="332" y2="74" stroke="#333333" stroke-width="0.5"/>

    <!-- Custom Foods -->
    <g transform="translate(18, 86)">
      <text x="0" y="14" font-family="-apple-system, SF Pro, Helvetica" font-size="14" fill="#CCCCCC">Custom Foods Library</text>
      <text x="314" y="14" font-family="-apple-system, SF Pro, Helvetica" font-size="16" fill="#555555" text-anchor="end">&gt;</text>
    </g>
    <line x1="18" y1="110" x2="332" y2="110" stroke="#333333" stroke-width="0.5"/>

    <!-- Saved Meals -->
    <g transform="translate(18, 122)">
      <text x="0" y="14" font-family="-apple-system, SF Pro, Helvetica" font-size="14" fill="#CCCCCC">Saved Meals</text>
      <text x="314" y="14" font-family="-apple-system, SF Pro, Helvetica" font-size="16" fill="#555555" text-anchor="end">&gt;</text>
    </g>
  </g>

  <!-- Notifications section -->
  <text x="20" y="650" font-family="-apple-system, SF Pro, Helvetica" font-size="13" font-weight="600" fill="#888888" letter-spacing="0.5">NOTIFICATIONS</text>

  <g transform="translate(20, 662)">
    <rect width="350" height="74" rx="14" fill="url(#cardGrad)"/>
    <g transform="translate(18, 14)">
      <text x="0" y="14" font-family="-apple-system, SF Pro, Helvetica" font-size="14" fill="#CCCCCC">Daily Reminder</text>
      <text x="314" y="14" font-family="-apple-system, SF Pro, Helvetica" font-size="14" fill="#888888" text-anchor="end">8:00 PM &gt;</text>
    </g>
    <line x1="18" y1="38" x2="332" y2="38" stroke="#333333" stroke-width="0.5"/>
    <g transform="translate(18, 50)">
      <text x="0" y="14" font-family="-apple-system, SF Pro, Helvetica" font-size="14" fill="#CCCCCC">Streak Warning</text>
      <!-- Toggle ON -->
      <rect x="270" y="0" width="44" height="24" rx="12" fill="#34C759"/>
      <circle cx="300" cy="12" r="10" fill="#FFFFFF"/>
    </g>
  </g>

  <!-- About section -->
  <g transform="translate(20, 750)">
    <text x="175" y="14" font-family="-apple-system, SF Pro, Helvetica" font-size="13" fill="#555555" text-anchor="middle">About and Legal  .  Rate on App Store  .  Support</text>
  </g>

  <!-- Tab bar (3 tabs) -->
  <g transform="translate(0, 780)">
    <rect width="390" height="64" fill="#1A1A1A"/>
    <line x1="0" y1="0" x2="390" y2="0" stroke="#333333" stroke-width="0.5"/>

    <!-- Nutrition tab - leaf icon -->
    <g transform="translate(52, 12)">
      <path d="M20,20 Q20,6 34,6 Q34,20 20,20 Z" fill="none" stroke="#888888" stroke-width="1.5"/>
      <path d="M20,20 Q27,16 30,10" fill="none" stroke="#888888" stroke-width="1.2" stroke-linecap="round"/>
      <text x="27" y="38" font-family="-apple-system, SF Pro, Helvetica" font-size="10" fill="#888888" text-anchor="middle">Nutrition</text>
    </g>

    <!-- Body tab - figure icon -->
    <g transform="translate(168, 12)">
      <circle cx="27" cy="6" r="3" fill="none" stroke="#888888" stroke-width="1.5"/>
      <line x1="27" y1="9" x2="27" y2="19" stroke="#888888" stroke-width="1.5"/>
      <line x1="21" y1="13" x2="33" y2="13" stroke="#888888" stroke-width="1.5" stroke-linecap="round"/>
      <line x1="27" y1="19" x2="22" y2="26" stroke="#888888" stroke-width="1.5" stroke-linecap="round"/>
      <line x1="27" y1="19" x2="32" y2="26" stroke="#888888" stroke-width="1.5" stroke-linecap="round"/>
      <text x="27" y="38" font-family="-apple-system, SF Pro, Helvetica" font-size="10" fill="#888888" text-anchor="middle">Body</text>
    </g>

    <!-- Profile tab (active) - person icon -->
    <g transform="translate(283, 12)">
      <rect x="-2" y="4" width="60" height="24" rx="12" fill="#4A90D9" opacity="0.15"/>
      <circle cx="27" cy="8" r="4.5" fill="none" stroke="#4A90D9" stroke-width="1.5"/>
      <path d="M17,24 Q17,16 27,16 Q37,16 37,24" fill="none" stroke="#4A90D9" stroke-width="1.5" stroke-linecap="round"/>
      <text x="27" y="38" font-family="-apple-system, SF Pro, Helvetica" font-size="10" font-weight="600" fill="#4A90D9" text-anchor="middle">Profile</text>
    </g>
  </g>

  <!-- Home indicator -->
  <rect x="142" y="826" width="106" height="5" rx="2.5" fill="#555555"/>
</svg>